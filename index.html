<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테트리스</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .intro {
      margin-bottom: 24px;
    }

    #overlay h2:empty,
    #result:empty {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <b>테트리스</b>
    <button id="settings">⚙ 설정</button>
  </header>

  <main>
    <div class="toolbar">
      <nav id="modes">
        <button data-mode="sprint" class="selected">40줄</button>
        <button data-mode="blitz">2분</button>
        <button data-mode="zen">무한</button>
      </nav>

      <button id="restart">↻ 다시 시작 · R</button>
    </div>

    <section class="arena">
      <aside>
        <div class="panel">
          <label>홀드</label>
          <canvas id="hold" width="120" height="80"></canvas>
        </div>

        <div class="stats">
          <label>시간</label>
          <strong id="time">0:00.000</strong>

          <label>줄</label>
          <strong>
            <span id="lines">0</span>
            <em id="goal"> / 40</em>
          </strong>

          <label>점수</label>
          <strong id="score">0</strong>

          <label>PPS</label>
          <strong id="pps">0.00</strong>

          <label>레벨</label>
          <strong id="level">1</strong>
        </div>
      </aside>

      <div class="boardwrap">
        <canvas id="board" width="320" height="640"></canvas>

        <div id="overlay">
          <h2></h2>
          <p id="result"></p>
          <button id="start">시작 ↵</button>
          <small>Enter 시작 · Esc 일시정지</small>
        </div>

        <div id="toast"></div>
      </div>

      <aside>
        <div class="panel">
          <label>다음</label>
          <canvas id="next" width="120" height="340"></canvas>
        </div>

        <div class="stats">
          <label>BACK TO BACK</label>
          <strong id="b2b">—</strong>

          <label>콤보</label>
          <strong id="combo">—</strong>
        </div>
      </aside>
    </section>

    <footer>
      ← → 이동　↑ / X 회전　Z 반시계　A 180°　Space 드롭　C 홀드
    </footer>

    <div class="mobile">
      <button data-act="hold">홀드</button>
      <button data-act="ccw">↶</button>
      <button data-act="left">←</button>
      <button data-act="soft">↓</button>
      <button data-act="right">→</button>
      <button data-act="cw">↷</button>
      <button data-act="hard">드롭</button>
    </div>

    <details>
      <summary>최고 기록</summary>
      <p id="records"></p>
    </details>
  </main>

  <dialog id="dialog">
    <div class="dialoghead">
      <h2>설정</h2>
      <button id="close" aria-label="설정 닫기">✕</button>
    </div>

    <nav id="tabs">
      <button data-tab="handling" class="selected">핸들링</button>
      <button data-tab="keys">키 설정</button>
      <button data-tab="view">화면·소리</button>
    </nav>

    <div id="options"></div>

    <button id="defaults">기본값 복원</button>

    <p>
      <small>자동 저장 · 키 버튼을 누른 후 새 키 입력</small>
    </p>
  </dialog>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
